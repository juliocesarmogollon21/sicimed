spring:
  application:
    name: sicimed
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sicimed?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    # No exponer mensajes internos en la pagina de error por defecto (seguridad)
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # En produccion definir la variable de entorno JWT_SECRET (minimo 32 caracteres)
    secret: ${JWT_SECRET:SICIMED-clave-de-desarrollo-cambiar-en-produccion-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
