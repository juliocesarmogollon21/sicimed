# Perfil de desarrollo: H2 en memoria, sin instalar MySQL.
# Se activa con -Dspring-boot.run.profiles=dev  (mvn spring-boot:run -Dspring-boot.run.profiles=dev)
spring:
  datasource:
    url: jdbc:h2:mem:sicimed;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
