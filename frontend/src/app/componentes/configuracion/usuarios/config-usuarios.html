<div class="container py-4 cfg-page">
  <div class="cfg-topbar">
    <div>
      <a routerLink="/admin" class="btn btn-outline-teal btn-sm mb-2">← Volver al menú</a>
      <h2 class="mb-0 text-teal">Usuarios</h2>
      <p class="text-muted small mb-0">Cuentas y roles</p>
    </div>
    <button type="button" class="btn btn-teal" (click)="abrirNuevo()">+ Nuevo usuario</button>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="mensaje" class="alert alert-success">{{ mensaje }}</div>

  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead>
          <tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of usuarios">
            <td>{{ u.username }}</td>
            <td>{{ u.nombreCompleto }}</td>
            <td><span class="badge text-bg-secondary">{{ u.rol }}</span></td>
            <td>
              <span [class]="u.activo !== false ? 'cfg-badge-activo' : 'cfg-badge-inactivo'">
                {{ u.activo !== false ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="text-end text-nowrap">
              <button class="btn btn-outline-primary btn-sm me-1" (click)="editar(u)">Editar</button>
              <button *ngIf="u.activo !== false" class="btn btn-outline-danger btn-sm" (click)="desactivar(u)">Desactivar</button>
              <button *ngIf="u.activo === false" class="btn btn-outline-success btn-sm" (click)="activar(u)">Activar</button>
            </td>
          </tr>
          <tr *ngIf="usuarios.length===0">
            <td colspan="5" class="text-muted text-center">Sin usuarios</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="cfg-backdrop" *ngIf="modalOpen" (click)="cerrar()">
    <div class="cfg-modal" (click)="$event.stopPropagation()">
      <div class="cfg-modal-header">
        <h5 class="mb-0 text-teal">{{ form.id ? 'Editar usuario' : 'Nuevo usuario' }}</h5>
        <button type="button" class="btn-close" (click)="cerrar()"></button>
      </div>
      <div class="cfg-modal-body">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" [(ngModel)]="form.username" name="uu">
        </div>
        <div class="mb-3">
          <label class="form-label">Password {{ form.id ? '(dejar vacío para no cambiar)' : '' }}</label>
          <input class="form-control" type="password" [(ngModel)]="form.password" name="up">
        </div>
        <div class="mb-3">
          <label class="form-label">Nombre completo</label>
          <input class="form-control" [(ngModel)]="form.nombreCompleto" name="un">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" [(ngModel)]="form.email" name="ue">
        </div>
        <div class="mb-3">
          <label class="form-label">Rol</label>
          <select class="form-select" [(ngModel)]="form.rol" name="ur">
            <option>ADMIN</option>
            <option>RECEPCIONISTA</option>
            <option>MEDICO</option>
            <option>PACIENTE</option>
          </select>
        </div>
        <div class="form-check" *ngIf="form.id">
          <input class="form-check-input" type="checkbox" [(ngModel)]="form.activo" name="ua" id="userActivo">
          <label class="form-check-label" for="userActivo">Activo</label>
        </div>
      </div>
      <div class="cfg-modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="cerrar()">Cancelar</button>
        <button type="button" class="btn btn-teal" (click)="guardar()">Guardar</button>
      </div>
    </div>
  </div>
</div>
