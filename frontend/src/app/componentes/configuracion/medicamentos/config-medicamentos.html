<div class="container py-4 cfg-page">
  <div class="cfg-topbar">
    <div>
      <a routerLink="/admin" class="btn btn-outline-teal btn-sm mb-2">← Volver al menú</a>
      <h2 class="mb-0 text-teal">Medicamentos</h2>
      <p class="text-muted small mb-0">Catálogo para recetas</p>
    </div>
    <button type="button" class="btn btn-teal" (click)="abrirNuevo()">+ Nuevo medicamento</button>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="mensaje" class="alert alert-success">{{ mensaje }}</div>

  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead>
          <tr><th>Nombre</th><th>Descripción</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let m of medicamentos">
            <td>{{ m.nombre }}</td>
            <td>{{ m.descripcion }}</td>
            <td>
              <span [class]="m.activo ? 'cfg-badge-activo' : 'cfg-badge-inactivo'">
                {{ m.activo ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="text-end text-nowrap">
              <button class="btn btn-outline-primary btn-sm me-1" (click)="editar(m)">Editar</button>
              <button *ngIf="m.activo" class="btn btn-outline-danger btn-sm" (click)="desactivar(m)">Desactivar</button>
              <button *ngIf="!m.activo" class="btn btn-outline-success btn-sm" (click)="activar(m)">Activar</button>
            </td>
          </tr>
          <tr *ngIf="medicamentos.length===0">
            <td colspan="4" class="text-muted text-center">Sin medicamentos en el catálogo</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="cfg-backdrop" *ngIf="modalOpen" (click)="cerrar()">
    <div class="cfg-modal" (click)="$event.stopPropagation()">
      <div class="cfg-modal-header">
        <h5 class="mb-0 text-teal">{{ form.id ? 'Editar medicamento' : 'Nuevo medicamento' }}</h5>
        <button type="button" class="btn-close" (click)="cerrar()"></button>
      </div>
      <div class="cfg-modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="form.nombre" name="mn">
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción / presentación</label>
          <input class="form-control" [(ngModel)]="form.descripcion" name="md">
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" [(ngModel)]="form.activo" name="ma" id="medsActivo">
          <label class="form-check-label" for="medsActivo">Activo</label>
        </div>
      </div>
      <div class="cfg-modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="cerrar()">Cancelar</button>
        <button type="button" class="btn btn-teal" (click)="guardar()">Guardar</button>
      </div>
    </div>
  </div>
</div>
