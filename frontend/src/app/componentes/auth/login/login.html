<div class="auth-split login-page">
  <aside class="auth-hero d-none d-lg-flex">
    <img src="https://images.unsplash.com/photo-1631217868264-e5b90bb7e133?auto=format&fit=crop&w=1400&q=80"
         alt="Atención médica SICIMED" loading="lazy">
    <div class="auth-hero-overlay">
      <span class="badge-pill">SICIMED</span>
      <h1>Policlínico San Rafael</h1>
      <p>Sedes, especialidades y agenda médica en una sola plataforma para pacientes y personal clínico.</p>
    </div>
  </aside>
  <section class="auth-panel">
    <div class="auth-card">
      <div class="d-flex align-items-center gap-2 mb-3">
        <span class="brand-mark">+</span>
        <div>
          <h2 class="h4 mb-0 text-teal">Iniciar sesión</h2>
        </div>
      </div>
      <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>
      <form (ngSubmit)="ingresar()">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input class="form-control form-control-lg" [(ngModel)]="username" name="username" required autocomplete="username" placeholder="Tu usuario">
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control form-control-lg" [(ngModel)]="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn btn-teal btn-lg w-100" [disabled]="cargando">
          {{ cargando ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
      <p class="small text-center mt-4 mb-0">
        ¿Eres paciente nuevo?
        <a routerLink="/registro" class="link-teal fw-semibold">Crear cuenta de paciente</a>
      </p>
    </div>
  </section>
</div>
