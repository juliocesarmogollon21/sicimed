<div class="auth-split registro-page">
  <aside class="auth-hero d-none d-lg-flex">
    <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1400&q=80"
         alt="Registro pacientes SICIMED" loading="lazy">
    <div class="auth-hero-overlay">
      <span class="badge-pill">Pacientes</span>
      <h1>Crea tu cuenta</h1>
      <p>Regístrate para reservar citas en el Policlínico San Rafael de forma rápida y segura.</p>
    </div>
  </aside>
  <section class="auth-panel">
    <div class="auth-card">
      <h2 class="h4 text-teal mb-1">Registro de paciente</h2>
      <p class="text-muted small mb-4">Completa tus datos para acceder a SICIMED</p>
      <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>
      <form (ngSubmit)="registrar()" class="row g-3">
        <div class="col-12">
          <label class="form-label">Nombre completo</label>
          <input class="form-control" [(ngModel)]="nombreCompleto" name="nombreCompleto" required autocomplete="name">
        </div>
        <div class="col-md-6">
          <label class="form-label">Usuario</label>
          <input class="form-control" [(ngModel)]="username" name="username" required autocomplete="username">
        </div>
        <div class="col-md-6">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="password" name="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" required autocomplete="email">
        </div>
        <div class="col-md-6">
          <label class="form-label">DNI</label>
          <input class="form-control" [(ngModel)]="dni" name="dni" required maxlength="20">
        </div>
        <div class="col-12">
          <label class="form-label">Teléfono</label>
          <input class="form-control" [(ngModel)]="telefono" name="telefono" autocomplete="tel">
        </div>
        <div class="col-12">
          <button class="btn btn-teal w-100" [disabled]="cargando">
            {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
          </button>
        </div>
      </form>
      <p class="small text-center mt-3 mb-0">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="link-teal fw-semibold">Iniciar sesión</a>
      </p>
    </div>
  </section>
</div>
